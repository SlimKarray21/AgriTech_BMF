services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: agritech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: piston_control
      POSTGRES_USER: piston_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    # 127.0.0.1 = accessible uniquement depuis la machine hôte, pas depuis internet
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - piston-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piston_user -d piston_control"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: agritech-mosquitto
    restart: unless-stopped
    user: "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - ./certs:/mosquitto/certs:ro
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:8883:8883"
    networks:
      - piston-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -W 3 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Ktor Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-now}
        - VCS_REF=${VCS_REF:-dev}
    image: zizyp/vannecontrol-backend:latest
    container_name: agritech-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/piston_control
      DATABASE_USER: piston_user
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      MQTT_BROKER: "tcp://mosquitto:1883"
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER}          # ← ADDED
      JWT_AUDIENCE: ${JWT_AUDIENCE}      # ← ADDED
      SESSION_ENCRYPT_KEY: ${SESSION_ENCRYPT_KEY}
      SESSION_SIGN_KEY: ${SESSION_SIGN_KEY}
      DISABLE_AUTH: "false"
      # Avatar upload configuration
      SERVER_BASE_URL: ${SERVER_BASE_URL:-http://localhost:8080/}
      TZ: UTC
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@vannecontrol.com}
    volumes:
      # Persist uploaded avatars across container restarts
      - avatar_uploads:/app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - piston-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: agritech-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - piston-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Mailpit (local SMTP server for development)
  mailpit:
    image: axllent/mailpit:latest
    container_name: agritech-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # Web UI
      - "127.0.0.1:1025:1025"   # SMTP
    networks:
      - piston-network

  # Redis Cache
  redis:
    image: redis:7.2-alpine
    container_name: agritech-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - piston-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin Web (React + Vite, servi par nginx)
  admin:
    build:
      context: ../Admin
      dockerfile: Dockerfile
      args:
        # Figée au build (Vite). URL du backend appelée depuis le navigateur.
        - VITE_API_BASE_URL=${ADMIN_API_BASE_URL:-http://localhost:8080}
    image: zizyp/vannecontrol-admin:latest
    container_name: agritech-admin
    restart: unless-stopped
    ports:
      # Port hôte configurable (défaut 8082) pour éviter les conflits :
      # nginx=80, backend=8080, et 8081 souvent pris par le serveur de dev Vite.
      - "127.0.0.1:${ADMIN_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - piston-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_logs:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
  # New volume for avatar uploads persistence
  avatar_uploads:
    driver: local

networks:
  piston-network:
    driver: bridge
