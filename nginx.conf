server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Proxy API : rend le conteneur admin autonome (accès direct sur son port,
    # ex. http://127.0.0.1:8082) sans dépendre du nginx principal. L'admin est
    # buildé avec VITE_API_BASE_URL=/backend-api → ces appels sont relayés ici
    # vers le backend via le réseau Docker interne ("backend:8080").
    location /backend-api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # SPA : toute route inconnue est renvoyée vers index.html pour que
    # react-router (/admin/dashboard, /partenaire/users, ...) fonctionne
    # même après un rechargement de page (F5).
    location / {
        try_files $uri $uri/ /index.html;
        # index.html ne doit jamais être mis en cache : il référence les bundles
        # hashés. Sinon, après un rebuild, le navigateur garde l'ancien index.html
        # (et donc l'ancien JS) et ne voit pas les nouvelles fonctionnalités.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Cache long pour les assets buildés (nom de fichier avec hash -> immuable).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Healthcheck simple.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
