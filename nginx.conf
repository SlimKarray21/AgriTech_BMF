server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA : toute route inconnue est renvoyée vers index.html pour que
    # react-router (/admin/dashboard, /partenaire/users, ...) fonctionne
    # même après un rechargement de page (F5).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets buildés (nom de fichier avec hash -> immuable).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Healthcheck simple.
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
